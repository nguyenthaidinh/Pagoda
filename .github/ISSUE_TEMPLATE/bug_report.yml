name: Bug report
description: Report reproducible incorrect behavior in PagodaPDF
title: "[Bug] "
labels: ["bug", "needs triage"]
body:
  - type: markdown
    attributes:
      value: |
        Do not upload confidential or personal documents. Create a sanitized sample that reproduces the problem.
        Report unpatched security vulnerabilities privately as described in SECURITY.md.
  - type: textarea
    id: description
    attributes:
      label: What happened?
      description: Describe the actual and expected behavior.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Reproduction steps
      placeholder: |
        1. Open the ... tool
        2. Select these options ...
        3. Process this sanitized sample ...
        4. Observe ...
    validations:
      required: true
  - type: textarea
    id: sample
    attributes:
      label: Sanitized sample
      description: Attach a generated or sanitized sample, or explain how to create one.
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: PagodaPDF version or commit
      placeholder: v0.1.0 or commit SHA
  - type: dropdown
    id: browser
    attributes:
      label: Browser
      options: [Chrome, Edge, Firefox, Safari, Brave, Other]
    validations:
      required: true
  - type: input
    id: environment
    attributes:
      label: Browser version and operating system
      placeholder: Edge 152 on Windows 11
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Console output
      description: Remove tokens, personal paths, and document content before posting.
      render: shell
  - type: checkboxes
    id: checklist
    attributes:
      label: Checklist
      options:
        - label: I searched existing issues.
          required: true
        - label: The sample and logs contain no sensitive data.
          required: true

