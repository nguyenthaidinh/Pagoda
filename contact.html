<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title data-i18n="site:pages.contact.browserTitle">Contact PagodaPDF</title>
    <meta
      name="description"
      content="Contact and support information for the PagodaPDF open source PDF toolkit."
    />
    <meta name="author" content="PagodaPDF" />
    <meta name="robots" content="index, follow" />
    <link rel="canonical" href="https://pagodapdf.example/contact" />
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://pagodapdf.example/contact" />
    <meta property="og:title" content="Contact PagodaPDF" />
    <meta
      property="og:description"
      content="Support for PagodaPDF is handled through the public source repository."
    />
    <meta property="og:site_name" content="PagodaPDF" />
    <link href="/src/css/styles.css" rel="stylesheet" />
    <link rel="manifest" href="/site.webmanifest" />
    <link rel="icon" type="image/svg+xml" href="/images/pagoda-logo.svg" />
  </head>
  <body class="antialiased bg-gray-900 text-gray-300">
    {{> navbar }}

    <main class="container mx-auto px-4 py-12 md:py-16">
      <section class="max-w-3xl mx-auto">
        <h1
          class="text-3xl md:text-5xl font-bold text-white mb-6"
          data-i18n="site:pages.contact.title"
        >
          Contact
        </h1>
        <div class="bg-gray-800 border border-gray-700 rounded-lg p-6">
          <h2
            class="text-xl font-semibold text-white mb-3"
            data-i18n="site:pages.contact.supportTitle"
          >
            Project Support
          </h2>
          <p
            class="text-gray-400"
            data-i18n="site:pages.contact.supportDescription"
          >
            Support and issue tracking for PagodaPDF are handled through the
            public source repository. Use the repository issue tracker for bug
            reports, questions, and feature requests.
          </p>
          <div class="flex flex-wrap gap-3 mt-5">
            <a
              href="https://github.com/nguyenthaidinh/Pagoda/issues"
              target="_blank"
              rel="noopener noreferrer"
              class="inline-flex items-center px-4 py-2 border border-blue-400 text-blue-300 hover:bg-blue-500 hover:text-white transition-colors"
            >
              GitHub Issues
            </a>
            <a
              href="mailto:hotropagoda@liotnu.com"
              class="inline-flex items-center px-4 py-2 border border-gray-600 text-gray-200 hover:border-blue-400 hover:text-blue-300 transition-colors"
            >
              hotropagoda@liotnu.com
            </a>
          </div>
        </div>
      </section>
    </main>

    {{> footer }}
    <script type="module" src="/src/js/utils/lucide-init.ts"></script>
    <script type="module" src="/src/js/mobileMenu.ts"></script>
    <script type="module" src="/src/js/main.ts"></script>
  </body>
</html>
