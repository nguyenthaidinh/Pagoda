<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title data-i18n="site:pages.notFound.browserTitle">
      404 - Page Not Found | PagodaPDF
    </title>
    <meta
      name="description"
      content="The page could not be found. Return to PagodaPDF tools."
    />
    <meta name="robots" content="noindex, nofollow" />
    <link rel="canonical" href="https://pagodapdf.example/404" />
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://pagodapdf.example/404" />
    <meta property="og:title" content="404 - Page Not Found | PagodaPDF" />
    <meta property="og:site_name" content="PagodaPDF" />
    <link href="/src/css/styles.css" rel="stylesheet" />
    <link rel="manifest" href="/site.webmanifest" />
    <link rel="icon" type="image/svg+xml" href="/images/pagoda-logo.svg" />
  </head>
  <body class="antialiased bg-gray-900 text-gray-300">
    {{> navbar }}

    <main class="min-h-screen container mx-auto px-4 py-20 text-center">
      <p class="text-8xl md:text-9xl font-bold text-indigo-500 mb-6">404</p>
      <h1
        class="text-3xl md:text-5xl font-bold text-white mb-4"
        data-i18n="site:pages.notFound.title"
      >
        Page Not Found
      </h1>
      <p
        class="text-lg text-gray-400 max-w-2xl mx-auto mb-8"
        data-i18n="site:pages.notFound.description"
      >
        This page is not available. The PDF tools are still ready from the home
        page.
      </p>
      <a
        href="/index.html#tools-header"
        class="inline-flex items-center justify-center rounded-lg bg-indigo-600 px-6 py-3 font-semibold text-white hover:bg-indigo-700 transition"
        data-i18n="site:pages.notFound.action"
      >
        Browse Tools
      </a>
    </main>

    {{> footer }}
    <script type="module" src="/src/js/utils/lucide-init.ts"></script>
    <script type="module" src="/src/js/mobileMenu.ts"></script>
    <script type="module" src="/src/js/main.ts"></script>
  </body>
</html>
